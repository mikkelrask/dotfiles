# Desktop 
#$MAIN = DP-1
#$VERT = DP-5

# Laptop
$mon = eDP-1
# Laptop to TV
$tv = HDMI-A-1

monitor = $mon, preferred, auto, 1
monitor = $tv, 1920x1080, 0x0, 1



# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Windows Rules https://wiki.hyprland.org/0.45.0/Configuring/Window-Rules/ #
source = monitor.conf

# Float Necessary Windows
windowrule = float, class:^(org.pulseaudio.pavucontrol)
windowrule = float, class:^()$,title:^(Picture in picture)$
windowrule = float, class:^()$,title:^(Save File)$
windowrule = float, class:^()$,title:^(Open File)$
windowrule = float, class:^(LibreWolf)$,title:^(Picture-in-Picture)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrule = float, class:^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrule = float, class:^(CachyOSHello)$
windowrule = float, class:^(zenity)$
windowrule = float, class:^()$,title:^(Steam - Self Updater)$
windowrule = float, class:^()$,title:^(rmpc)$
# Increase the opacity
windowrule = opacity 0.92, class:^(thunar|nemo)$
windowrule = opacity 0.96, class:^(discord|armcord|webcord)$
windowrule = opacity 0.95, title:^(QQ|Telegram)$
windowrule = opacity 0.95, title:^(NetEase Cloud Music Gtk4)$
# Decorations related to floating windows on workspaces 1 to 10
windowrule = bordersize 2, floating:1, onworkspace:w[fv1-10]
windowrule = bordercolor $cachylblue, floating:1, onworkspace:w[fv1-10]
windowrule = rounding 10, floating:1, onworkspace:w[fv1-10]
# Decorations related to tiling windows on workspaces 1 to 10
windowrule = bordersize 3, floating:0, onworkspace:f[1-10]
windowrule = rounding 4, floating:0, onworkspace:f[1-10]

# General window rules
windowrule = float, title:^(Picture-in-Picture)$
windowrule = size 960 540, title:^(Picture-in-Picture)$
windowrule = move 25%-, title:^(Picture-in-Picture)$
windowrule = float, title:^(notetaker|imv|mpv|danmufloat|termfloat|nemo|ncmpcpp|rmpc)$
windowrule = size 1700 960, title:^(rmpc)$
windowrule = rounding 12, title:^(rmpc)$
windowrule = size 1200 960, title:^(notetaker)$
windowrule = move 25%-, title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = size 660 540, title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp|rmpc)$
windowrule = pin, title:^(danmufloat)$
windowrule = rounding 5, title:^(danmufloat|termfloat)$
#windowrule = animation slide right, class:^(kitty|Alacritty)$
windowrule = noblur, class:^(org.mozilla.firefox)$

windowrule = float, class:^()$, title:^(Extension: (Bitwarden Password Manager) - Bitwarden — LibreWolf)$
windowrule = size 500 900, class:^()$, title:^(Extension: (Bitwarden Password Manager) - Bitwarden — LibreWolf)$
windowrule = move 4312 807, class:^()$, title:^(Extension: (Bitwarden Password Manager) - Bitwarden — LibreWolf)$
# Windows Rules End #

# Workspaces Rules https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/ #
# workspace = 1, default:true, monitor:$priMon
# workspace = 6, default:true, monitor:$secMon
# Workspace selectors https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#workspace-selectors
# workspace = r[1-5], monitor:$priMon
# workspace = r[6-10], monitor:$secMon
# workspace = special:scratchpad, on-created-empty:$applauncher
# no_gaps_when_only deprecated instead workspaces rules with selectors can do the same
# Smart gaps from 0.45.0 https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#smart-gaps
workspace = w[tv1-10], gapsout:5, gapsin:3
workspace = f[1], gapsout:5, gapsin:3
# Workspaces Rules End #

# Layers Rules #
#layerrule = animation slide top, logout_dialog
# layerrule = animation popin 50%, waybar
#layerrule = animation slide down, waybar
#layerrule = animation fade 50%, wallpaper
# Layers Rules End #

# Hyprland workspace rules for monitor assignment
# $MAIN = main monitor (horizontal)
# DP-3 = vertical monitor
  


# Pin workspaces 1 and 3 to the vertical monitor (DP-3)
workspace = 1, monitor: $VERT
workspace = 3, monitor: $VERT

# Pin all other workspaces to the main monitor ($MAIN)
workspace = 2, monitor:$MAIN
workspace = 4, monitor:$MAIN
workspace = 5, monitor:$MAIN
workspace = 6, monitor:$MAIN
workspace = 7, monitor:$MAIN
workspace = 8, monitor:$MAIN
workspace = 9, monitor:$MAIN
workspace = 10, monitor:$MAIN

# Alternative approach - set default workspace for each monitor
# This ensures any new workspaces created will follow the monitor assignment
workspace = special:scratchpad, monitor:$MAIN

# Assign apps to workspaces
windowrulev2 = workspace 2, class:(librewolf)
windowrulev2 = workspace 4, class:(obsidian)
windowrulev2 = workspace 3, class:(Slack)
windowrulev2 = workspace 3, class:(vesktop)
windowrulev2 = workspace 7, class:(PrismLauncher)
windowrulev2 = workspace 7, class:(modrinth-app)
windowrulev2 = workspace 7, class:(heroic)
windowrulev2 = workspace 7, class:(cartridges)
windowrulev2 = workspace 6, class:(KiCad)
windowrulev2 = workspace 6, class:(cantata)
windowrulev2 = workspace 6, class:(figma-linux)
windowrulev2 = workspace 5, class:(Code)
windowrulev2 = workspace 6, class:(Spotify)
windowrulev2 = workspace 7, class:(steam)
windowrulev2 = workspace 7, class:(socialclubhelper.exe)
windowrulev2 = workspace 7, class:(launcher.exe)

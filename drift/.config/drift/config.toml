[engine]
fps              = 30
cycle_seconds    = 0    # 0 = stay on one scene
scenes           = "waveform"
theme            = "cosmic"
shuffle          = false
hide_tmux_status = false

[scene.constellation]
star_count      = 80
connect_radius  = 0.18
twinkle         = true
max_connections = 4

[scene.rain]
charset = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789"

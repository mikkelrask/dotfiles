set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'
#set -g @continuum-restore 'on'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'git@github.com:tmux-plugins/tmux-battery.git'
#set -g @plugin 'git@github.com:rose-pine/tmux.git'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @tmux-url-bind 'z'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @fzf-tmux-bindings 'on'
set -g mouse on
set -g default-terminal 'xterm-ghostty'
set -sg terminal-overrides ",*:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u

# Change prefix from 'Ctrl+B' to 'Ctrl+A'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload with prefix + R
bind r  source-file ~/.config/tmux/tmux.conf \; display "█▓░ Configuration was reloaded"

bind æ set-window-option synchronize-panes \; display-message "█▓░ synchronize"

bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

bind C-g display-popup \
       -d "#{pane_current_path}" \
       -w 80% \
       -h 80% \
       -E "lazygit"

bind t display-popup \
       -d "#{pane_current_path}" \
       -w 80% \
       -h 80% \
       -E "zsh"

bind C-r display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "yazi"

bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

#set -g status-position top 
set-window-option -g automatic-rename on

set-window-option -g pane-base-index 1
set -g base-index 1
set-option -g renumber-windows on

set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity on
setw -g monitor-silence 30
set -g renumber-windows on

set -g bell-action none
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g set-clipboard on          # use system clipboard
#set -g status-style bg=default,fg=default,bright
#set -g status-left ""

set-option -g allow-passthrough on

# allow terminal scrolling
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'

#set -g pane-border-style "fg=colour0"
#set -g pane-active-border-style "fg=colour0"
#set -g status-justify left
#set -g status-style "bg=colour0,fg=colour1"
#set -g status-interval 2

# window mode
#setw -g mode-style "bg=colour0,fg=colour1"

# split sytle
#set -g pane-border-style "bg=colour0,fg=colour0"
#set -g pane-active-border-style "bg=colour0,fg=colour0"

#resizing
setw -g aggressive-resize on

# window status
#setw -g window-status-format " ● "
#setw -g window-status-current-format " ● "
#set -g window-status-current-style "#{?window_zoomed_flag,fg=colour3,fg=colour2,nobold}"
#set -g window-status-style "bg=colour0"

bind -r i run-shell "tmux neww ~/.local/bin/cheat-fzf"

# navigate with vim keys instead of arrow keys

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode
setw -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'Y' send -X copy-end-of-line
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle


# Looks
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @catppuccin_flavour "default"

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

set -g @catppuccin_date_time_text "%H:%M"

set -g @catppuccin_window_status_style "rounded" # can comment this out

set -g status-position top 

bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'

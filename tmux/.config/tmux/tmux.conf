set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'git@github.com:tmux-plugins/tmux-battery.git'
#set -g @plugin 'git@github.com:rose-pine/tmux.git'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @tmux-url-bind 'x'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @fzf-tmux-bindings 'on'
set -g @fzf-tmux-bindings 'on'
set -g status-interval 60
cwd='#{pane_current_path}'
set -g status-right "$cwd"
#set -g left_separator ''
set -g status-left '#[fg=green]#H #[fg=black]• #[fg=green,bright]#(uname -r | cut -c 1-6)#[default]'

#set -g default-terminal "screen-256color"
#set-option -sa terminal-overrides ",xterm-kitty:RGB"

# Change prefix from 'Ctrl+B' to 'Ctrl+A'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload with prefix + R
bind r  source-file ~/.config/tmux/tmux.conf \; display "Configuration was reloaded"

bind æ set-window-option synchronize-panes \; display-message "█▓░ synchronize"

bind C-j display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}'  |\
    xargs tmux switch-client -t"


set -g status-position top 
#set-window-option -g automatic-rename on

set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity on
setw -g monitor-silence 30
set -g renumber-windows on

set -g bell-action none
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g set-clipboard on          # use system clipboard
set -g status-bg default
set -g status-style bg=default

set-option -g allow-passthrough on

# allow terminal scrolling
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'

set -g pane-border-style "fg=colour0"
set -g pane-active-border-style "fg=colour0"
#set -g window-active-style 'bg=colour236'
#set -g window-style 'bg=black'

set -g status-justify left
set -g status-style "bg=colour0,fg=colour1"
set -g status-interval 2

# messaging
set -g message-style "bg=colour1,fg=colour0"
set -g message-command-style "bg=colour1,fg=colour1"

# window mode
setw -g mode-style "bg=colour1,fg=colour0"

# split sytle
set -g pane-border-style "bg=colour0,fg=colour0"
set -g pane-active-border-style "bg=colour0,fg=colour0"

#resizing
setw -g aggressive-resize on

# window status
setw -g window-status-format "#[bg=colour246,fg=colour0,noreverse]█▓░ #W "
setw -g window-status-current-format "#[bg=colour1,fg=colour0,noreverse]█▓░ #W "

bind -r i run-shell "tmux neww ~/.local/bin/cheat-fzf"

# navigate with vim keys instead of arrow keys

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode
setw -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'Y' send -X copy-end-of-line
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle

run '~/.config/tmux/plugins/tpm/tpm'

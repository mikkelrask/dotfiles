set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @tmux-url-bind 'z'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @fzf-tmux-bindings 'on'
set -g mouse on
set -g default-terminal 'xterm-ghostty'
set -sg terminal-overrides ",*:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# Change prefix from 'Ctrl+B' to 'Ctrl+A'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload with prefix + R
bind r  source-file ~/.config/tmux/tmux.conf \; display "█▓░ Configuration was reloaded"

bind æ set-window-option synchronize-panes \; display-message "█▓░ synchronize"

bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

bind C-g display-popup \
       -d "#{pane_current_path}" \
       -w 80% \
       -h 80% \
       -E "lazygit"

bind t display-popup \
       -d "#{pane_current_path}" \
       -w 80% \
       -h 80% \
       -E "zsh"

bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

set-window-option -g automatic-rename on

set-window-option -g pane-base-index 1
set -g base-index 1
set-option -g renumber-windows on

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
setw -g monitor-silence 0
set -g renumber-windows on

set -g bell-action none
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g set-clipboard on          # use system clipboard
#set -g status-style bg=default,fg=default,bright

set-option -g allow-passthrough on

# allow terminal scrolling
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'


# split sytle
 set -g pane-border-style "bg=colour0,fg=colour0"
 set -g pane-active-border-style "bg=colour0,fg=colour0"

#resizing
setw -g aggressive-resize on

bind -r i run-shell "tmux neww ~/.local/bin/cheat-fzf"

# navigate with vim keys instead of arrow keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode
setw -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'Y' send -X copy-end-of-line
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle


# Looks
set -g status-position bottom
# Status bar layout (top)
set -g status-style "bg=terminal,fg=terminal"
set -g status-left "#[fg=#{?client_prefix,colour10,colour11},bg=default]#[fg=colour0,bg=#{?client_prefix,colour10,colour11},bold] #S #[fg=#{?client_prefix,colour10,colour11},bg=default] "
set -g status-left-length 30

set -g status-right " #{s|$HOME|~|:pane_current_path} | %H:%M "
set -g status-right-length 80

setw -g window-status-separator " "

# Inactive: dimmed, no bg
setw -g window-status-format " #[fg=colour1]#I #[fg=colour10]#W "

# Active: pill with rounded ends
setw -g window-status-current-format "#[fg=colour9,bg=default]#[fg=colour0,bg=colour9,bold] #I #[fg=colour0,bg=colour9,bold] #W #[fg=colour9,bg=default]"

set -g pane-border-style "fg=colour6"
set -g pane-active-border-style "fg=colour6"
set -g message-style "fg=colour0,bg=colour11"

run '/home/mr/.config/tmux/plugins/tpm/tpm'
set -g bell-action none  # after TPM so plugins can't override it

# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window
blur=0
blur_layer=0
blur_optimized=2
blur_params_num_passes = 2
blur_params_radius = 8
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 6
shadows_blur = 12
shadows_position_x = 2
shadows_position_y = 2
shadowscolor= 0x222222ff

border_radius=12
no_radius_when_single=1
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 0-horizontal,1-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=100
animation_duration_open=100
animation_duration_tag=125
animation_duration_close=75
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
inhibit_regardless_of_visibility=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
focus_cross_tag=1
enable_floating_snap=1
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=dk

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=1

# Appearance
gappih=8
gappiv=8
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=#ffff6347
maxmizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tgmix
tagrule=id:3,layout_name:vertical_scroller
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Window rules ("assign to workspace")
windowrule=tags:3,appid:slack
windowrule=tags:3,appid:discord
windowrule=tags:7,appid:steam

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=CTRL+SHIFT,r,reload_config

# menu and terminal
bind=ALT,space,spawn,/home/mr/.local/bin/launcher
bind=ALT,e,spawn,rofi -show emoji
bind=ALT,d,spawn,wmenu-run -l 20
bind=alt,Return,spawn,ghostty

# Browser and file browser
bind=ALT,w,spawn,librewolf
windowrule=tags:2,appid:librewolf
bind=ALT,t,spawn,cosmic-files
windowrule=isfloating:1,appid:cosmic-files
windowrule=isfloating:1,title:rmpc
windowrule=isfloating:1,title:nm
# toggle bar
bind=SUPER+SHIFT,q,spawn_shell,killall -SIGUSR1 waybar
bind=SUPER+CTRL,q,spawn,killall -SIGUSR2 waybar

# exit
bindr=CTRL+SHIFT,x,quit
bindr=ALT+SHIFT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER+Shift,Left,focusdir,left
bind=SUPER+Shift,Right,focusdir,right
bind=SUPER+Shift,Up,focusdir,up
bind=SUPER+Shift,Down,focusdir,down

# switch window focus
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=ALT,v,togglefloating,
bind=ALT,a,togglemaxmizescreen,
bind=ALT,f,togglefullscreen,
#bind=ALT+SHIFT,f,togglefakefullscreen,
#bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
#bind=SUPER+SHIFT,I,restore_minimized
#bind=ALT,z,toggle_scratchpad
bind=ALT,n,spawn,/home/mr/.local/bin/brain-note

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# Layouts
bind=SUPER,t,setlayout,tile
bind=SUPER,v,setlayout,vertical_grid
bind=SUPER,c,setlayout,spiral
bind=SUPER,x,setlayout,scroller
bind=SUPER,n,switch_layout
bind=SUPER,a,togglegaps

# tag switch
bind=SUPER+SHIFT,h,viewtoleft,0
bind=SUPER+SHIFT,Left,viewtoleft_have_client,0
bind=SUPER+SHIFT,l,viewtoright,0
#bind=CTRL,l,viewtoright_have_client,0
bind=CTRL+SUPER,h,tagtoleft,0
bind=CTRL+SUPER,l,tagtoright,0

bind=ALT,1,comboview,1,0
bind=ALT,2,comboview,2,0
bind=ALT,3,comboview,3,0
bind=ALT,4,comboview,4,0
bind=ALT,5,comboview,5,0
bind=ALT,6,comboview,6,0
bind=ALT,7,comboview,7,0
bind=ALT,8,comboview,8,0
bind=ALT,9,comboview,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=ALT,1,tagsilent,1
bind=SUPER+ALT,1,tag,1,0
bind=SUPER+ALT,2,tag,2,0
bind=SUPER+ALT,3,tag,3,0
bind=SUPER+ALT,4,tag,4,0
bind=SUPER+ALT,5,tag,5,0
bind=SUPER+ALT,6,tag,6,0
bind=SUPER+ALT,7,tag,7,0
bind=SUPER+ALT,8,tag,8,0
bind=SUPER+ALT,9,tag,9,0

# Music stuff
bind=ALT,M,spawn,"/home/mr/.local/bin/playerctl.sh"
bind=ALT+SHIFT,M,spawn,"/home/mr/.local/bin/musicplayer.sh"
bind=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +2% 
bind=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -2%
bind=NONE,XF86AudioMute,spawn,amixer set Master toggle

# Other custom stuff
bind=CTRL+ALT,p,spawn,"/home/mr/.local/bin/shot.sh"

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
#bind=SUPER+ALT,Left,tagmon,left
#bind=SUPER+ALT,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=CTRL+SHIFT,g,togglegaps

# movewin
#bind=CTRL+SHIFT,Up,movewin,+0,-50
#bind=CTRL+SHIFT,Down,movewin,+0,+50
#bind=CTRL+SHIFT,Left,movewin,-50,+0
#bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,k,resizewin,+0,-50
bind=CTRL+ALT,j,resizewin,+0,+50
bind=CTRL+ALT,h,resizewin,-50,+0
bind=CTRL+ALT,l,resizewin,+50,+0

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaxmizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,-1
mousebind=NONE,btn_right,killclient,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# Monitor stuff
monitorrule=DP-1,0.55,1,tile,0,1,0,0,3440,1440,60
monitorrule=eDP-1,0.55,1,tile,0,1,760,1440,1920,1200,60

exec-once=/home/mr/.config/mango/autostart.sh
